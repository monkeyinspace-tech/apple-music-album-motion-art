<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Apple Music Album Motion Art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0A"/><stop offset="0.6" stop-color="#161614"/><stop offset="1" stop-color="#1D3A2A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#1D8A4E" stop-opacity="0.4"/><stop offset="1" stop-color="#1D8A4E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#F3C12E" stop-opacity="0.35"/><stop offset="1" stop-color="#F3C12E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#E8763A" stop-opacity="0.2"/><stop offset="1" stop-color="#E8763A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F1EC"/><stop offset="0.5" stop-color="#F3C12E"/><stop offset="1" stop-color="#1D8A4E"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow1)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>
  <rect width="1280" height="360" fill="url(#glow3)"/>

  <!-- ondas de choque (motion) -->
  <g fill="none" stroke="#F3C12E" stroke-opacity="0.25" stroke-width="2">
    <circle cx="980" cy="180" r="60"/><circle cx="980" cy="180" r="120"/><circle cx="980" cy="180" r="180"/>
  </g>
  <g fill="none" stroke="#1D8A4E" stroke-opacity="0.2" stroke-width="1.5">
    <circle cx="980" cy="180" r="90"/><circle cx="980" cy="180" r="150"/>
  </g>

  <!-- capas em papel (3D) -->
  <g transform="translate(880,60) rotate(-8)">
    <rect width="130" height="165" rx="8" fill="#1D8A4E" opacity="0.9"/>
    <rect x="16" y="16" width="98" height="98" fill="#0B0B0A" opacity="0.9"/>
    <rect x="16" y="120" width="60" height="8" fill="#F2F1EC" opacity="0.6"/>
    <rect x="16" y="132" width="40" height="6" fill="#F2F1EC" opacity="0.4"/>
  </g>
  <g transform="translate(1020,90) rotate(6)">
    <rect width="120" height="155" rx="8" fill="#E8763A" opacity="0.9"/>
    <rect x="14" y="14" width="92" height="92" fill="#0B0B0A" opacity="0.9"/>
    <rect x="14" y="112" width="55" height="8" fill="#F2F1EC" opacity="0.6"/>
    <rect x="14" y="124" width="35" height="6" fill="#F2F1EC" opacity="0.4"/>
  </g>
  <g transform="translate(950,130) rotate(-2)">
    <rect width="115" height="150" rx="8" fill="#1E3A8A" opacity="0.85"/>
    <rect x="13" y="13" width="89" height="89" fill="#0B0B0A" opacity="0.9"/>
    <rect x="13" y="108" width="50" height="8" fill="#F2F1EC" opacity="0.6"/>
    <rect x="13" y="120" width="30" height="6" fill="#F2F1EC" opacity="0.4"/>
  </g>

  <!-- sparkles / partículas -->
  <g fill="#F3C12E">
    <path d="M900 60 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z"/>
    <path d="M1150 280 l2 8 8 2 -8 2 -2 8 -2 -8 -8 -2 8 -2z"/>
    <circle cx="860" cy="200" r="2" opacity="0.6"/>
    <circle cx="1120" cy="100" r="1.5" opacity="0.5"/>
    <circle cx="1080" cy="300" r="2.5" opacity="0.4"/>
  </g>

  <!-- título principal -->
  <text x="70" y="140" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="url(#title)" letter-spacing="-1">Apple Music</text>
  <text x="70" y="200" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="url(#title)" letter-spacing="-1">Album Motion Art</text>

  <!-- subtítulo -->
  <text x="74" y="248" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F2F1EC" opacity="0.9">Transforme sua capa em vídeo animado para a Apple Music</text>
  <text x="74" y="280" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8D8C86">Python · FFmpeg · 1:1 3840² · 3:4 2048×2732 · loop perfeito · validação automática</text>

  <!-- créditos -->
</svg>
